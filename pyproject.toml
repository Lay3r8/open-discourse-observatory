[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "open-discourse-observatory"
version = "0.1.0"
description = "Reproducible research pipeline for ideological pressure and pluralism events."
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.4,<2",
  "polars>=1.35,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[project.scripts]
odo = "odo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/odo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
